name: Gerar formatação

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Prettier no runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Formatar arquivos com Prettier
        run: npx prettier --write .

      - name: Empacotar alterações de formatação
        run: |
          set -euo pipefail
          rm -rf /tmp/formatted
          mkdir -p /tmp/formatted
          changed_files=$(git diff --name-only)
          if [ -z "$changed_files" ]; then
            echo "Nada para formatar."
            exit 0
          fi
          while IFS= read -r file; do
            mkdir -p "/tmp/formatted/$(dirname "$file")"
            cp "$file" "/tmp/formatted/$file"
          done <<< "$changed_files"
          tar -czf formatting-patch.tar.gz -C /tmp/formatted .

      - name: Enviar pacote de formatação
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: formatting-patch.tar.gz
          if-no-files-found: ignore
          retention-days: 3
