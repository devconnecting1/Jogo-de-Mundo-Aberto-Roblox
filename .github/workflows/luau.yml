name: Luau & Rojo

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: luau-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Validar presídio e gerar place
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Instalar Rojo e Lune (com cache)
        uses: ./.github/actions/setup-tools

      - name: Gerar mapa estático e cena do preview
        run: |
          set -euo pipefail
          lune run tools/build_world.luau
          lune run tools/export_scene.luau
          test -s src/world/PrisaoCentral.rbxm
          test -s preview/scene.json

      - name: Rodar testes do presídio
        run: lune run tests/prison.test.luau

      - name: Compilar o lugar final com Rojo
        run: |
          set -euo pipefail
          mkdir -p build
          rojo build default.project.json -o build/PrisaoCentral.rbxlx
          test -s build/PrisaoCentral.rbxlx

      - name: Validar o lugar final
        run: lune run tools/validate_place.luau build/PrisaoCentral.rbxlx

      - name: Publicar artefato do lugar
        uses: actions/upload-artifact@v7
        with:
          name: PrisaoCentral-place
          path: build/PrisaoCentral.rbxlx
          if-no-files-found: error
          retention-days: 14
