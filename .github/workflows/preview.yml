name: Preview & JavaScript

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ESLint, Prettier, unitários e Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint (somente CI)
        run: npx eslint preview scripts tests playwright.config.mjs eslint.config.mjs --max-warnings=0

      - name: Prettier (somente CI)
        run: npx prettier --check .

      - name: Testes unitários do preview
        run: npm run test:unit

      - name: Instalar Chromium e dependências do sistema
        run: npx playwright install --with-deps chromium

      - name: Testes end-to-end do visualizador
        run: npm run test:e2e

      - name: Guardar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
