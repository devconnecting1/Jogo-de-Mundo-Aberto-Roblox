name: Instalar Rojo e Lune
description: Baixa a toolchain Roblox com cache entre execuções.

runs:
  using: composite
  steps:
    - name: Restaurar cache da toolchain
      id: cache-tools
      uses: actions/cache@v4
      with:
        path: ~/.casa27-tools
        key: casa27-tools-${{ runner.os }}-rojo-7.7.1-lune-0.11.1

    - name: Baixar Rojo e Lune
      if: steps.cache-tools.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        tools="$HOME/.casa27-tools"
        mkdir -p "$tools/rojo" "$tools/lune"
        curl -fsSL --retry 3 -o "$tools/rojo.zip" \
          "https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip"
        unzip -q "$tools/rojo.zip" -d "$tools/rojo"
        curl -fsSL --retry 3 -o "$tools/lune.zip" \
          "https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip"
        unzip -q "$tools/lune.zip" -d "$tools/lune"
        chmod +x "$tools/rojo/rojo" "$tools/lune/lune"

    - name: Adicionar toolchain ao PATH
      shell: bash
      run: |
        echo "$HOME/.casa27-tools/rojo" >> "$GITHUB_PATH"
        echo "$HOME/.casa27-tools/lune" >> "$GITHUB_PATH"
        "$HOME/.casa27-tools/rojo/rojo" --version
        "$HOME/.casa27-tools/lune/lune" --version
